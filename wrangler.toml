# Static Astro site on Workers Assets. Cloudflare Builds runs `npx wrangler deploy`.
# Worker name must match Cloudflare Workers Builds project (cheatsarcraiders-com).
name = "cheatsarcraiders-com"
main = "src/worker.js"
compatibility_date = "2024-09-23"
workers_dev = true

# Custom domain: attach cheatsarcraiders.com in the dashboard (Workers → Settings → Domains).
# Prefer zone-level Always Use HTTPS + www→apex there instead of a custom User Worker.

[build]
command = "node scripts/cf-build.mjs"

[assets]
directory = "./dist"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
binding = "ASSETS"
# Serve static assets first; worker only adds redirects/HSTS when needed (avoids blank 500s on asset errors).
run_worker_first = false